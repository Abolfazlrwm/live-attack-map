<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Attack Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1120; --panel: #111a2e; --border: #1e293b;
    --text: #e2e8f0; --muted: #64748b; --accent: #f43f5e; --ok: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  #map { flex: 1; height: 100vh; background: var(--bg); }
  .panel { width: 340px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .panel h1 { font-size: 1.1rem; padding: 16px; border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
  .panel h1 span { color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .stat { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .stat .num { font-size: 1.4rem; font-weight: 700; color: var(--ok); }
  .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .lists { flex: 1; overflow-y: auto; padding: 12px; }
  .lists h3 { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin: 10px 0 6px; letter-spacing: 1px; }
  .lists ul { list-style: none; font-size: 0.8rem; }
  .lists li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #1e293b; }
  .feed { height: 200px; overflow-y: auto; border-top: 1px solid var(--border); padding: 8px 12px; font-size: 0.72rem; font-family: monospace; }
  .feed .row { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dashed #16233c; }
  .feed .ip { color: var(--accent); } .feed .usr { color: #fbbf24; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 0.8rem; }
  .timeline { padding: 12px; border-bottom: 1px solid var(--border); }
  .timeline h3 { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>LIVE <span>ATTACK</span> MAP</h1>
  <div class="stats">
    <div class="stat"><div class="num" id="total">0</div><div class="lbl">Total attacks</div></div>
    <div class="stat"><div class="num" id="unique">0</div><div class="lbl">Unique IPs</div></div>
    <div class="stat"><div class="num" id="last60">0</div><div class="lbl">Last 60s</div></div>
    <div class="stat"><div class="num" id="countries">0</div><div class="lbl">Countries</div></div>
  </div>
  <div class="timeline">
    <h3>Attacks / minute (last 30m)</h3>
    <canvas id="timeline-chart" height="80"></canvas>
  </div>
  <div class="lists">
    <h3>Top countries</h3><ul id="top-countries"></ul>
    <h3>Top usernames</h3><ul id="top-users"></ul>
    <h3>Top passwords</h3><ul id="top-passwords"></ul>
  </div>
  <div class="feed" id="feed"><div class="empty">Waiting for connections…</div></div>
</div>

<script>
const map = L.map('map', { zoomControl: true }).setView([25, 20], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
}).addTo(map);

const TARGET = [35.6892, 51.3890];
const events = [];
const activeLines = [];
const MAX_LINES = 40;

const targetMarker = L.circleMarker(TARGET, {
  radius: 10, color: '#22d3ee', fillColor: '#22d3ee', fillOpacity: 0.25, weight: 2
}).addTo(map);
setInterval(() => targetMarker.setRadius(10 + Math.random() * 4), 500);

function animateAttack(rec) {
  if (rec.lat == null || rec.lon == null) return;
  const origin = [rec.lat, rec.lon];
  const line = L.polyline([origin, TARGET], {
    color: '#f43f5e', weight: 2, opacity: 0.6, dashArray: '6 10'
  }).addTo(map);
  activeLines.push(line);
  if (activeLines.length > MAX_LINES) map.removeLayer(activeLines.shift());
  const dot = L.circleMarker(origin, { radius: 3, color: '#fb7185', fillColor: '#fb7185', fillOpacity: 1 }).addTo(map);
  const steps = 120, delay = 12;
  let i = 0;
  const timer = setInterval(() => {
    i++;
    const t = i / steps;
    dot.setLatLng([origin[0] + (TARGET[0] - origin[0]) * t,
                   origin[1] + (TARGET[1] - origin[1]) * t]);
    if (i >= steps) {
      clearInterval(timer);
      map.removeLayer(dot);
      setTimeout(() => map.removeLayer(line), 4000);
    }
  }, delay);
}

function bump(mapObj, key, max = 500) {
  mapObj[key] = (mapObj[key] || 0) + 1;
  if (mapObj[key] > max) mapObj[key] = max;
}

function topList(mapObj, n = 5) {
  return Object.entries(mapObj).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function renderLists() {
  const countries = {}, users = {}, passwords = {};
  events.forEach(e => { bump(countries, e.country || 'Unknown'); bump(users, e.username); bump(passwords, e.password); });
  const fill = (id, obj) => {
    const el = document.getElementById(id);
    el.innerHTML = topList(obj).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join('')
      || '<li style="color:var(--muted)">—</li>';
  };
  fill('top-countries', countries);
  fill('top-users', users);
  fill('top-passwords', passwords);
  document.getElementById('total').textContent = events.length;
  document.getElementById('unique').textContent = new Set(events.map(e => e.src_ip)).size;
  document.getElementById('countries').textContent = Object.keys(countries).length;
}

function updateFeed(rec) {
  const feed = document.getElementById('feed');
  if (feed.querySelector('.empty')) feed.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'row';
  const time = new Date(rec.timestamp).toLocaleTimeString();
  row.innerHTML = `<span>${time}</span><span class="ip">${rec.src_ip}</span>
                   <span>${rec.country || '?'}</span><span class="usr">${rec.username}</span>`;
  feed.prepend(row);
  while (feed.children.length > 30) feed.lastChild.remove();
}

const socket = io();
socket.on('attack', rec => {
  events.push(rec);
  if (events.length > 500) events.shift();
  animateAttack(rec);
  updateFeed(rec);
  renderLists();
});

// refresh the "last 60s" counter every second
setInterval(() => {
  const cutoff = Date.now() - 60000;
  const n = events.filter(e => new Date(e.timestamp).getTime() >= cutoff).length;
  document.getElementById('last60').textContent = n;
}, 1000);

// attacks-per-minute timeline chart
const timelineCtx = document.getElementById('timeline-chart').getContext('2d');
const timelineChart = new Chart(timelineCtx, {
  type: 'bar',
  data: { labels: [], datasets: [{ data: [], backgroundColor: '#f43f5e' }] },
  options: {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#64748b', maxTicksLimit: 6 }, grid: { display: false } },
      y: { ticks: { color: '#64748b', precision: 0 }, grid: { color: '#1e293b' } }
    }
  }
});

async function refreshTimeline() {
  try {
    const res = await fetch('/api/timeline?minutes=30');
    const data = await res.json();
    timelineChart.data.labels = data.map(d => d.time);
    timelineChart.data.datasets[0].data = data.map(d => d.count);
    timelineChart.update();
  } catch (e) { /* dashboard still works without the chart */ }
}
refreshTimeline();
setInterval(refreshTimeline, 15000);
</script>
</body>
</html>
