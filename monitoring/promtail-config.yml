server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: honeypot_attacks
    static_configs:
      - targets: [localhost]
        labels:
          job: honeypot
          __path__: /var/log/honeypot/attacks.jsonl
    pipeline_stages:
      - json:
          expressions:
            src_ip: src_ip
            username: username
            country: country
      - labels:
          country:

  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
